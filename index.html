<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0F17" />
    <meta
      name="description"
      content="CampusOS unifies academic resources, student ERP, travel and work opportunities, and campus parking into one intelligent space."
    />
    <title>CampusOS — Your entire campus. One intelligent space.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0F17'/%3E%3Cpath d='M8 21V11l8-4 8 4v10' stroke='%23D8C39A' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='17' r='2.4' fill='%238BD8CB'/%3E%3C/svg%3E"
    />

    <script>
      // Apply the persisted theme before first paint to avoid a flash of the wrong theme.
      // The store writes JSON, so parse it rather than comparing the raw string.
      (function () {
        try {
          var stored = null;
          try {
            stored = JSON.parse(localStorage.getItem('campusos.theme'));
          } catch (e) {
            stored = null;
          }
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
